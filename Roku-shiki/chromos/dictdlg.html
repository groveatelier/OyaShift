<!-- dictdlg.html -->
<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
<head>
  <style>
    html {
      min-height: 5em;
      min-width: 5em;
      background: rgb(193, 222, 207);
    }
    #ime-btn {
      border: none;
      background-color: rgb(193, 222, 207);
      color: #202020;
     
      padding: 9px 16px;
      font-size: 13px;
      letter-spacing: 0.5px;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    #ime-btn:hover {
      background-color: rgb(203, 232, 217); /* わずかに明るくする */
      color: #ffffff;
    }

    #ime-btn:active {
      background-color: #222222;
    }
  </style>
</head>
<body><form id="dictDialog" name="dictDialog" action="">
  <p>
    <table align="center">
      <tr>
        <td rowspan="2" valign="bottom"><img src="rokuicon-s.png" alt="ime ICON"></td>
        <td align="center">　親指シフト キーボード</td>
      </tr>
      <tr><td align="right" valign="top"><small><div id="ver">x</div></small></td></tr>
    </table>
  </p><hr>
  <input type="text" id="Kanji" placeholder="登録文字"><br/>
  <input type="text" id="Kana" placeholder="よみかた"><br/>
  <p align="center"><button id="Remove">抹消</button>　<button id="Engage">登録</button></p>
  <hr>
  <div class="option-tab">
    <p align="center"><button id="ime-btn">六式　ime　version 4</button></p>
  </div>
  <script src="dictdlg.js"></script>
</form></body>
</html>
