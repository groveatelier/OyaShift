<!-- dictdlg.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>六式 IME 設定 オプション</title>
  <style>
    html, body {      /* ウィンドウ全体にフィットさせる設定 */
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color:#122516;
      color: #c0e0c0;
      font-family: sans-serif;
      overflow: hidden; /* 無駄なスクロールバーを消す */
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
    }
    #input-area {   /* 入力エリアをウインドウの高さに合わせて伸縮させる */
      width: 100%;
      flex: 1; 
      padding: 8px;
      box-sizing: border-box;
      background-color: #2d2d2d;
      color: #c0e0c0;           
      border: 1px solid #444444;
      border-radius: 4px;
      font-size: 14px;
      resize: none;
      outline: none;
    }
    #input-area:focus {
      border-color: #007acc;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .flat-btn {
      flex: 1;
      border: none;
      outline: none;
      box-shadow: none;
      color: white;
      padding: 4px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-blue { background-color: #2196F3; }
    .btn-blue:hover { background-color: #1976D2; }
    .btn-green { background-color: #4CAF50; }
    .btn-green:hover { background-color: #388E3C; }
  </style>
</head>
<body>
  <div class="container">
    <textarea id="input-area" placeholder="テスト入力窓・・Shift+Enter でクリップボード"></textarea>
    <div class="btn-group">
      <button id="btn-clean" class="flat-btn btn-blue" type="button">ローカル 整理</button>
      <button id="btn-save" class="flat-btn btn-blue" type="button">ローカル 保存</button>
      <button id="btn-merge" class="flat-btn btn-green" type="button">辞書 マージ</button>
      <button id="btn-write" class="flat-btn btn-green" type="button">辞書 書き出し</button>
      <input type="file" id="import-file-input" accept=".txt" style="display: none;">
    </div>
  </div>
  <script src="options.js"></script>
</form></body>
</html>
